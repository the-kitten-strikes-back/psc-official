<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pen Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 18px 30px rgba(15,23,42,.06)}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:8px;margin-bottom:14px}button{padding:12px 18px;border:none;border-radius:10px;background:#0066cc;color:#fff;font-weight:700;cursor:pointer}</style>
</head>
<body>
    <header><nav><div class="nav-container"><a href="{{ url_for('home') }}" class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="PSC Logo">PSC</a><ul class="nav-links"><li><a href="{{ url_for('dashboard') }}">Dashboard</a></li></ul></div></nav></header>
    <main class="wrap">
        <form method="POST" class="card">
            <h1>Community Edit: {{ pen.name }}</h1>
            <label>Name<input type="text" name="name" value="{{ pen.name }}"></label>
            <label>Description<textarea name="description">{{ pen.description or '' }}</textarea></label>
            <label>Ink Level<input type="number" name="ink_level" value="{{ pen.ink_level }}"></label>
            <label>Ink Color<input type="text" name="ink_color" value="{{ pen.ink_color }}"></label>
            <label>Class<select name="class_"><option value="A" {% if pen.class_ == 'A' %}selected{% endif %}>A</option><option value="B" {% if pen.class_ == 'B' %}selected{% endif %}>B</option><option value="C" {% if pen.class_ == 'C' %}selected{% endif %}>C</option><option value="D" {% if pen.class_ == 'D' %}selected{% endif %}>D</option></select></label>
            <label>PRS<input type="number" name="prs" value="{{ pen.prs }}"></label>
            <label>Location<input type="text" name="location" value="{{ pen.location or '' }}"></label>
            <label>Retired reason<textarea name="retired_reason">{{ pen.retired_reason or '' }}</textarea></label>
            <label><input type="checkbox" name="retired" {% if pen.retired %}checked{% endif %}> Retired</label>
            <label><input type="checkbox" name="famous" {% if pen.famous %}checked{% endif %}> Famous</label>
            <button type="submit">Save Community Edit</button>
        </form>
    </main>
</body>
</html>
