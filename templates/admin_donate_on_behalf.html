<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate on Behalf | SoCAC</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#e8f6ff;
      --muted:#9bb0c5;
      --accent:#7cf9ff;
      --panel:rgba(9,20,36,0.78);
      --line:rgba(124,249,255,0.25);
      --shadow:0 30px 60px rgba(0,0,0,0.45);
    }
    body{
      margin:0;
      background:linear-gradient(180deg, #0d1119 0%, #0c1018 100%);
      color:var(--ink);
      font-family:"Space Grotesk", sans-serif;
      letter-spacing:0.2px;
      min-height:100vh;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 20% 10%, rgba(80,120,180,0.18), transparent 45%);
      opacity:0.35;
      pointer-events:none;
      z-index:0;
    }
    header{
      padding:28px 32px;
      border-bottom:1px solid var(--line);
      background:rgba(12,16,24,0.92);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      position:sticky;
      top:0;
      z-index:2;
      backdrop-filter:blur(6px);
    }
    h1{
      margin:0;
      font-family:"Orbitron", sans-serif;
      letter-spacing:1px;
    }
    .subtitle{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 18px;
      border-radius:999px;
      border:1px solid rgba(120,150,200,0.4);
      background:rgba(120,150,200,0.12);
      color:var(--ink);
      text-decoration:none;
      font-weight:600;
      letter-spacing:0.6px;
      text-transform:uppercase;
      font-size:12px;
      transition:transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(80,120,180,0.25);}
    .layout{
      max-width:680px;
      margin:30px auto 80px;
      padding:0 24px;
      position:relative;
      z-index:1;
    }
    .panel{
      background:rgba(18,22,32,0.9);
      border:1px solid rgba(120,150,200,0.2);
      border-radius:16px;
      padding:28px;
      box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.03);
      position:relative;
      overflow:hidden;
      backdrop-filter:blur(8px);
    }
    .panel h2{
      margin:0 0 20px;
      font-family:"Orbitron", sans-serif;
      letter-spacing:0.6px;
    }
    .error{
      background:rgba(255,59,92,0.15);
      border:1px solid rgba(255,59,92,0.4);
      border-radius:10px;
      padding:12px 16px;
      color:#ff808f;
      margin-bottom:20px;
    }
    .form-group{
      margin-bottom:20px;
    }
    .form-group label{
      display:block;
      margin-bottom:6px;
      font-weight:600;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:0.8px;
      color:var(--muted);
    }
    .form-group input,
    .form-group textarea,
    .form-group select{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(120,150,200,0.3);
      background:rgba(10,14,20,0.9);
      color:var(--ink);
      font-size:14px;
      font-family:"Space Grotesk", sans-serif;
      box-sizing:border-box;
      transition:border-color 0.2s ease;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus{
      outline:none;
      border-color:var(--accent);
    }
    .form-group textarea{
      resize:vertical;
      min-height:80px;
    }
    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .form-row .form-group{
      margin-bottom:0;
    }
    .submit-btn{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      background:linear-gradient(135deg, #0a84ff, #0066cc);
      color:#fff;
      font-weight:700;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:1px;
      cursor:pointer;
      transition:transform 0.2s ease, box-shadow 0.2s ease;
      margin-top:8px;
    }
    .submit-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 24px rgba(10,132,255,0.3);
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
</head>
<body>
  <header>
    <div>
      <h1>Donate on Behalf</h1>
      <div class="subtitle">SoCAC — Register a donation for another member</div>
    </div>
    <a href="{{ url_for('sector_page', sector='socac') }}" class="btn">Back to Console</a>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Register Donation</h2>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label for="donor_username">Donor Username</label>
          <input type="text" id="donor_username" name="donor_username" placeholder="Enter the member's username" required>
        </div>

        <div class="form-group">
          <label for="name">Pen Name</label>
          <input type="text" id="name" name="name" placeholder="e.g., Blue Ballpoint, Red Gel Pen" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Describe the pen - brand, model, special features, condition..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="ink_level">Ink Level</label>
            <input type="number" id="ink_level" name="ink_level" min="0" max="100" value="100">
          </div>
          <div class="form-group">
            <label for="ink_color">Ink Color</label>
            <input type="text" id="ink_color" name="ink_color" value="Black">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="class_">Class Rating</label>
            <select id="class_" name="class_">
              <option value="A">A - Premium</option>
              <option value="B">B - Good</option>
              <option value="C" selected>C - Average</option>
              <option value="D">D - Basic</option>
            </select>
          </div>
          <div class="form-group">
            <label for="prs">PRS</label>
            <input type="number" id="prs" name="prs" min="0" max="100" value="50">
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" value="Vault Shelf A">
        </div>

        <button type="submit" class="submit-btn">Register Donation</button>
      </form>
    </div>
  </div>

  <div id="psc-chatbot-root"></div>
  <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
</body>
</html>
