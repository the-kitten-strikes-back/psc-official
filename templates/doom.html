<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - PSC Mini Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: sans-serif; }
        #dosbox { width: 100vw; height: 100vh; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #000; color: #fff;
            z-index: 100; text-align: center; gap: 16px;
        }
        #loading .spinner {
            width: 48px; height: 48px; border: 4px solid #333; border-top-color: #a00;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #888; font-size: 14px; }
        #loading .progress { color: #a00; font-size: 13px; margin-top: 4px; }
        #back-link {
            position: fixed; top: 12px; left: 12px; z-index: 50;
            background: rgba(0,0,0,0.7); color: #ccc; text-decoration: none;
            padding: 6px 14px; border-radius: 6px; font-size: 13px; transition: color .2s;
        }
        #back-link:hover { color: #fff; }
        #controls-hint {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 50; background: rgba(0,0,0,0.7); color: #666; font-size: 12px;
            padding: 6px 14px; border-radius: 6px; pointer-events: none;
        }
    </style>
</head>
<body>
    <a id="back-link" href="{{ url_for('games') }}">&larr; Back to Games</a>
    <div id="controls-hint">Click to lock mouse &middot; Ctrl+F12 to unlock</div>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Loading DOOM</h2>
        <p>Downloading DOSBox + WebAssembly emulator…</p>
        <div class="progress" id="progress-text"></div>
    </div>

    <div id="dosbox"></div>

    <script src="https://js-dos.com/cdn/js-dos-api.js"></script>
    <script>
        (function () {
            var loadingEl = document.getElementById("loading");
            var progressEl = document.getElementById("progress-text");

            function setProgress(msg) {
                if (progressEl) progressEl.textContent = msg;
            }

            setProgress("Initialising emulator…");

            var dosbox = document.getElementById("dosbox");
            var emulator = Dos(dosbox, {
                wdosboxUrl: "https://js-dos.com/cdn/7.22.1/wdosbox.js",
                cycles: -1,
                autolock: true,
            });

            emulator.on("progress", function (msg) {
                if (loadingEl) setProgress(msg);
            });

            emulator.on("error", function (err) {
                if (loadingEl) {
                    loadingEl.innerHTML = '<h2 style="color:#a00">Failed to load</h2><p style="color:#888">' +
                        String(err) + '</p><p style="color:#555;margin-top:12px">Try refreshing the page.</p>';
                }
            });

            emulator.ready(function (fs, main) {
                setProgress("Extracting DOOM1.WAD…");

                var wadPath = "{{ url_for('static', filename='DOOM1.WAD') }}";

                fs.extract("DOOM1.WAD", wadPath).then(function () {
                    if (loadingEl) loadingEl.style.display = "none";
                    main(["-fullscreen", "-iwad", "DOOM1.WAD"]);
                }).catch(function (err) {
                    if (loadingEl) {
                        loadingEl.innerHTML = '<h2 style="color:#a00">WAD Load Failed</h2><p style="color:#888">' +
                            String(err) + '</p>';
                    }
                });
            });
        })();
    </script>
</body>
</html>
