<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - PSC Mini Games</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/js-dos.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #app { width: 100%; height: 100%; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #000; color: #fff;
            z-index: 100; text-align: center; gap: 16px;
        }
        #loading .spinner {
            width: 48px; height: 48px; border: 4px solid #333; border-top-color: #a00;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #888; font-size: 14px; }
        #back-link {
            position: fixed; top: 12px; left: 12px; z-index: 200;
            background: rgba(0,0,0,0.7); color: #ccc; text-decoration: none;
            padding: 6px 14px; border-radius: 6px; font-size: 13px; transition: color .2s;
        }
        #back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <a id="back-link" href="{{ url_for('games') }}">&larr; Back to Games</a>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Loading DOOM</h2>
        <p>Downloading WebAssembly emulator and game bundle…</p>
    </div>

    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/js-dos.min.js"></script>
    <script>
        (function () {
            var loadingEl = document.getElementById("loading");
            var appEl = document.getElementById("app");

            Dos(appEl, {
                pathPrefix: "https://cdn.jsdelivr.net/npm/js-dos@8.3.20/dist/emulators/",
                url: "https://cdn.dos.zone/custom/dos/doom.jsdos",
                onEvent: function (event, arg) {
                    if (event === "ci-ready") {
                        if (loadingEl) loadingEl.style.display = "none";
                        arg.setFullscreen(true);
                    }
                }
            });
        })();
    </script>
</body>
</html>
