<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM - PSC Mini Activities</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }
        .doom-layout { display: flex; flex-direction: column; gap: 16px; }
        .activity-container {
            background: #000; border-radius: 18px; overflow: hidden;
            position: relative; aspect-ratio: 640 / 400;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        #status {
            color: #888; font-family: monospace; font-size: 14px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; z-index: 10;
        }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .dpad { display: flex; flex-direction: column; align-items: center; }
        .dpad-row { display: flex; }
        .ctrl-btn {
            background: #fff; border: 1px solid var(--gray-200); border-radius: 10px;
            font-weight: 700; display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; touch-action: manipulation;
            width: 56px; height: 56px; box-shadow: var(--shadow-sm); transition: var(--transition-fast);
        }
        .ctrl-btn:active { background: var(--gray-100); transform: scale(0.95); }
        .ctrl-btn.wide { width: auto; padding: 0 18px; font-size: 0.85rem; height: 48px; }
        .ctrl-btn:active.active { background: var(--primary); color: #fff; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <a href="{{ url_for('home') }}" class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="PSC Logo">PSC</a>
                <ul class="nav-links">
                    <li><a href="{{ url_for('entertainment_system') }}">Back to Activities</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="wrap">
        <div class="doom-layout">
            <h1>DOOM</h1>
            <p style="color: var(--gray-500);">WebAssembly-powered native port. Press Enter to start.</p>

            <div class="activity-container card" style="padding:0">
                <div id="status">Loading DOOM...</div>
                <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>

            <div class="card controls" style="padding:16px">
                <div class="dpad">
                    <div class="dpad-row">
                        <span class="ctrl-btn" onpointerdown="simulateInput(38,true)" onpointerup="simulateInput(38,false)" onpointerleave="simulateInput(38,false)">&#9650;</span>
                    </div>
                    <div class="dpad-row">
                        <span class="ctrl-btn" onpointerdown="simulateInput(37,true)" onpointerup="simulateInput(37,false)" onpointerleave="simulateInput(37,false)">&#9664;</span>
                        <span class="ctrl-btn" onpointerdown="simulateInput(40,true)" onpointerup="simulateInput(40,false)" onpointerleave="simulateInput(40,false)">&#9660;</span>
                        <span class="ctrl-btn" onpointerdown="simulateInput(39,true)" onpointerup="simulateInput(39,false)" onpointerleave="simulateInput(39,false)">&#9654;</span>
                    </div>
                </div>
                <div>
                    <span class="ctrl-btn wide" onpointerdown="simulateInput(17,true)" onpointerup="simulateInput(17,false)" onpointerleave="simulateInput(17,false)">FIRE (Ctrl)</span>
                    <span class="ctrl-btn wide" onpointerdown="simulateInput(32,true)" onpointerup="simulateInput(32,false)" onpointerleave="simulateInput(32,false)">USE (Space)</span>
                    <span class="ctrl-btn wide" onpointerdown="simulateInput(13,true)" onpointerup="simulateInput(13,false)" onpointerleave="simulateInput(13,false)">ENTER</span>
                    <span class="ctrl-btn wide" onpointerdown="simulateInput(27,true)" onpointerup="simulateInput(27,false)" onpointerleave="simulateInput(27,false)">ESC</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let wasmMemory = null;
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        const WIDTH = 640, HEIGHT = 400;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        let scratchImageData = ctx.createImageData(WIDTH, HEIGHT);
        let globalExports = null;

        function readString(offset, length) {
            return new TextDecoder("utf8").decode(new Uint8Array(wasmMemory.buffer, offset, length));
        }

        function getDoomKey(keyCode) {
            switch (keyCode) {
                case 8: return 127;
                case 17: return 0x80 + 0x1d;
                case 18: return 0x80 + 0x38;
                case 37: return 0xac;
                case 38: return 0xad;
                case 39: return 0xae;
                case 40: return 0xaf;
                default:
                    if (keyCode >= 65 && keyCode <= 90) return keyCode + 32;
                    if (keyCode >= 112 && keyCode <= 123) return keyCode + 75;
                    return keyCode;
            }
        }

        function setupInput(exports) {
            const handleKey = (e, isDown) => {
                let code = e.keyCode;
                if (e.key === "Control") code = 17;
                if (e.key === "Alt") code = 18;
                if (e.key === "Enter") code = 13;
                if (e.key === " ") code = 32;
                if ([37,38,39,40,32,17,18].includes(code)) e.preventDefault();
                exports.add_browser_event(isDown ? 0 : 1, getDoomKey(code));
            };
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            canvas.focus();
        }

        function simulateInput(keyCode, isDown) {
            if (!globalExports) return;
            globalExports.add_browser_event(isDown ? 0 : 1, getDoomKey(keyCode));
        }

        async function initDoom() {
            const status = document.getElementById('status');
            try {
                if (typeof WebAssembly === 'undefined') {
                    status.innerText = 'WebAssembly not supported on this device.';
                    status.style.color = 'red';
                    return;
                }
                wasmMemory = new WebAssembly.Memory({ initial: 108 });
                status.innerText = 'Downloading activity data...';
                const resp = await fetch("{{ url_for('static', filename='doom.wasm') }}");
                if (!resp.ok) throw new Error('Failed to load doom.wasm: ' + resp.status);
                const buffer = await resp.arrayBuffer();
                status.innerText = 'Initializing...';

                const imports = {
                    js: {
                        js_console_log: (offset, len) => console.log("[Doom]", readString(offset, len)),
                        js_stdout: (offset, len) => console.log("[Doom]", readString(offset, len)),
                        js_stderr: (offset, len) => console.error("[Doom]", readString(offset, len)),
                        js_milliseconds_since_start: () => performance.now(),
                        js_draw_screen: (ptr) => {
                            const src = new Uint8ClampedArray(wasmMemory.buffer, ptr, WIDTH * HEIGHT * 4);
                            scratchImageData.data.set(src);
                            ctx.putImageData(scratchImageData, 0, 0);
                        }
                    },
                    env: { memory: wasmMemory }
                };

                const { instance } = await WebAssembly.instantiate(buffer, imports);
                status.style.display = 'none';
                globalExports = instance.exports;
                instance.exports.main();
                setupInput(instance.exports);

                const step = () => {
                    instance.exports.doom_loop_step();
                    requestAnimationFrame(step);
                };
                requestAnimationFrame(step);

            } catch (err) {
                status.innerText = 'Error: ' + (err.message || String(err));
                status.style.color = 'red';
                console.error(err);
            }
        }

        window.onload = initDoom;
    </script>
</body>
</html>
