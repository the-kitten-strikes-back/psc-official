<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Thread</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>.wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 18px 30px rgba(15,23,42,.06)}.msg{padding:12px 0;border-bottom:1px solid #e2e8f0}textarea,input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:8px}button{margin-top:14px;padding:12px 18px;border:none;border-radius:10px;background:#0066cc;color:#fff;font-weight:700;cursor:pointer}</style>
</head>
<body>
    <header><nav><div class="nav-container"><a href="{{ url_for('home') }}" class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="PSC Logo">PSC</a><ul class="nav-links"><li><a href="{{ url_for('dashboard') }}">Dashboard</a></li></ul></div></nav></header>
    <main class="wrap">
        <div class="card">
            <h1>{{ loan.pen.name }} Thread</h1>
            <p><strong>Meeting point:</strong> {{ loan.meeting_point or "Not set yet" }}</p>
            <form method="POST">
                <label>Update meeting point<input type="text" name="meeting_point" value="{{ loan.meeting_point or '' }}" placeholder="Library desk, front gate, vault shelf..."></label>
                <label>Message<textarea name="message" rows="4" placeholder="Coordinate pickup, return timing, or pen condition notes."></textarea></label>
                <button type="submit">Send Update</button>
            </form>
            <div style="margin-top:20px;">
                {% for message in messages %}
                <div class="msg">
                    <strong>{{ message.sender.username }}</strong> • {{ message.created_at.strftime('%b %d, %Y %H:%M') }}
                    <p style="margin-top:6px;">{{ message.message }}</p>
                </div>
                {% else %}
                <p>No messages yet.</p>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
