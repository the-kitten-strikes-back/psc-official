<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSC Mini Activities</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>.wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 18px 30px rgba(15,23,42,.06)}button{margin-top:12px;padding:12px 18px;border:none;border-radius:10px;background:#0066cc;color:#fff;font-weight:700;cursor:pointer}.doom-card{background:linear-gradient(135deg,#1a0000,#2d0000);border-color:#500;text-align:center}.doom-card h2{color:#a00;font-size:28px;margin-bottom:8px}.doom-card p{color:#a88;font-size:14px;margin-bottom:16px}.doom-card button{background:#a00;font-size:16px;padding:14px 32px}.doom-card button:hover{background:#c00}.activity-grid{display:grid;gap:24px;grid-template-columns:1fr 1fr}</style>
</head>
<body>
    <header><nav><div class="nav-container"><a href="{{ url_for('home') }}" class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="PSC Logo">PSC</a><ul class="nav-links"><li><a href="{{ url_for('community') }}">Community</a></li></ul></div></nav></header>
    <main class="wrap">
        <div class="activity-grid">
            <div class="card">
                <h1>Little Pen Mini Activities</h1>
                <p>Guess which pen has the highest PRS, then reveal the leaderboard.</p>
                <ul>
                    {% for pen in pens %}
                    <li>{{ pen.name }} — Class {{ pen.class_ }}</li>
                    {% endfor %}
                </ul>
                <button id="reveal">Reveal Top Pen</button>
                <p id="answer" style="margin-top:14px;"></p>
            </div>

            <div class="card doom-card">
                <h2>DOOM</h2>
                <p>WebAssembly-powered DOSBox port of the classic 1993 FPS.</p>
                <a href="{{ url_for('doom') }}"><button>Play DOOM</button></a>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('reveal').addEventListener('click', function () {
            const answer = document.getElementById('answer');
            answer.textContent = 'Top current pen: {{ pens[0].name if pens else "No pens yet" }}.';
        });
    </script>
</body>
</html>
